name: Sincronizar proveedores y publicar

on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas (hora UTC)
  workflow_dispatch:         # botón manual en la pestaña Actions
  push:
    branches: [main]
    paths-ignore:
      - "data/products.json"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # para guardar products.json y las fotos en el repositorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar navegador (para leer el inventario de iPhone)
        continue-on-error: true   # si falla, el script usa el plan B sin navegador
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Sincronizar inventario
        run: node scripts/sync-proveedores.js
        env:
          URL_PERF_11: ${{ secrets.URL_PERF_11 }}
          URL_PERF_ORIG: ${{ secrets.URL_PERF_ORIG }}
          URL_IPHONE: ${{ secrets.URL_IPHONE }}
          URL_INNOVACION: ${{ secrets.URL_INNOVACION }}
      - name: Guardar products.json
        run: |
          mkdir -p img/perfumes
          git config user.name "luxpoint7-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore: actualizar inventario [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi

  # 1) Arma la carpeta pública y la sube como artefacto "github-pages" (corre en push, schedule y manual)
  build:
    needs: sync
    if: ${{ always() && (needs.sync.result == 'success' || needs.sync.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generar config con el número de WhatsApp (Secret)
        run: node scripts/make-config.js
        env:
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
      - name: Armar carpeta pública
        run: |
          rm -rf _site
          mkdir -p _site img/perfumes
          cp index.html styles.css app.js cart.js _site/
          cp -r data _site/data
          cp -r img _site/img
          rm -f _site/data/config.example.json
          touch _site/.nojekyll
          test -f _site/index.html && test -f _site/data/products.json && test -f _site/data/config.json
          echo "Archivos publicados: $(find _site -type f | wc -l)"
      - uses: actions/configure-pages@v5
      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: _site

  # 2) Publica ese artefacto (el artefacto ya existe porque este job depende de "build")
  deploy:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
